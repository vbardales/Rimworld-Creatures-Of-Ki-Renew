<!doctype html><meta charset="utf-8"><style>
:root{--veil:#503F2F;--inkPrimary:#F2ECE1;--inkSecondary:#E9BD82;--accent:#69BCE6;--badgeInk:#17120E;--iconOutline:var(--accent)}*{margin:0;padding:0;box-sizing:border-box}
html,body{width:896px;height:504px;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif}

body{background:url(Preview.png) center/cover}
@property --lueur{syntax:'<percentage>';inherits:false;initial-value:24%}

.panel-bottom-left{inset:auto auto 0 0;padding:20px 3rem;border-radius:0 2rem 0 0;border-width:1px 1px 0 0}
.panel-bottom-right{inset:auto 0 0 auto;padding:20px 3rem;border-radius:2rem 0 0 0;border-width:1px 0 0 1px}
.panel-top-right{inset:0 0 auto auto;border-radius:0 0 0 2rem;border-width:0 0 1px 1px}
.panel>.copy{position:relative;left:auto;top:auto;width:430px}.panel>.echo{top:var(--panelEchoTop,6%);right:var(--panelEchoRight,2%);left:auto;width:var(--panelEchoWidth,50%);height:auto;aspect-ratio:var(--echoAspect,1);z-index:-1;clip-path:inset(0 100% 0 0);animation:echo-trace 1.4s 600ms ease-in-out forwards}.panel h1,.panel p{color:var(--inkPrimary)}.panel p{max-width:32ch;text-wrap:pretty}.panel .rule{width:3.5rem;height:3px;margin:1.1rem 0 1rem}

@keyframes panel-light-up{to{--lueur:32%}}

.copy{position:absolute;z-index:2;left:50px;top:54px;width:430px;color:var(--inkPrimary);text-shadow:0 3px 10px rgba(0,0,0,.75)}
