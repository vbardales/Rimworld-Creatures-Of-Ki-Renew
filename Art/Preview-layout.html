:root{--veil:#503F2F;--inkPrimary:#F2ECE1;--inkSecondary:#E9BD82;--accent:#69BCE6;--badgeInk:#17120E;--iconOutline:var(--accent)}*{margin:0;padding:0;box-sizing:border-box}

@property --lueur{syntax:'<percentage>';inherits:false;initial-value:24%}
